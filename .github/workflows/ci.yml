name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE_SHA="$PUSH_BASE_SHA"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t CHANGED_PATHS < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA"
          )
          LANE="$(python3 scripts/validate_redshift_objective.py \
            --ci-scope "${CHANGED_PATHS[@]}")"
          printf 'base_sha=%s\nlane=%s\n' "$BASE_SHA" "$LANE" >> "$GITHUB_OUTPUT"

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    needs: [scope]
    env:
      DANDER_TEST_POSTGRES_DSN: postgresql://postgres:dander_test@127.0.0.1:5432/dander_test
    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_PASSWORD: dander_test
          POSTGRES_DB: dander_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dander_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install locked environment
        if: needs.scope.outputs.lane != 'objective'
        run: uv sync --frozen --extra dev --extra postgres
      - name: Ruff lint
        if: needs.scope.outputs.lane == 'full'
        run: uv run ruff check .
      - name: Ruff format
        if: needs.scope.outputs.lane == 'full'
        run: uv run ruff format --check .
      - name: Strict typing
        if: needs.scope.outputs.lane == 'full'
        run: python3 scripts/check_types.py
      - name: Control contract drift
        if: needs.scope.outputs.lane == 'full'
        run: uv run python scripts/check_control_contracts.py
      - name: Tests
        if: needs.scope.outputs.lane == 'full'
        run: uv run pytest
      - name: Dependency audit
        if: needs.scope.outputs.lane == 'full'
        run: |
          uv export --frozen --extra runtime-all --format requirements.txt --no-dev --no-emit-project \
            --output-file /tmp/dander-requirements.txt
          uv run --with pip-audit pip-audit --strict -r /tmp/dander-requirements.txt
      - name: Benchmark and harness checks
        if: needs.scope.outputs.lane == 'benchmark'
        env:
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        run: |
          uv run ruff check scripts/benchmarks tests/portability \
            scripts/validate_redshift_objective.py tests/test_validate_redshift_objective.py
          uv run ruff format --check scripts/benchmarks tests/portability \
            scripts/validate_redshift_objective.py tests/test_validate_redshift_objective.py
          python3 scripts/check_types.py
          uv run pytest tests/portability tests/test_validate_redshift_objective.py -q
          mapfile -t OBJECTIVES < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" \
              | grep -E 'docs/evidence/phase8/.+rc32-redshift.+objectives?\.json$' || true
          )
          if [ "${#OBJECTIVES[@]}" -gt 0 ]; then
            python3 scripts/validate_redshift_objective.py "${OBJECTIVES[@]}"
          fi
      - name: Objective and evidence checks
        if: needs.scope.outputs.lane == 'objective'
        env:
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        run: |
          python3 scripts/verify_repository_target.py --remote origin --push
          mapfile -t JSON_FILES < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" \
              | grep -E '^docs/evidence/phase8/.+\.json$' || true
          )
          for FILE in "${JSON_FILES[@]}"; do
            python3 -m json.tool "$FILE" >/dev/null
          done
          mapfile -t OBJECTIVES < <(
            printf '%s\n' "${JSON_FILES[@]}" \
              | grep -E 'rc32-redshift.+objectives?\.json$' || true
          )
          if [ "${#OBJECTIVES[@]}" -gt 0 ]; then
            python3 scripts/validate_redshift_objective.py "${OBJECTIVES[@]}"
          fi
          uv run --isolated --frozen --extra dev --extra postgres \
            pytest tests/test_validate_redshift_objective.py tests/test_repository_safety.py -q

  terraform-quality:
    name: Terraform quality
    runs-on: ubuntu-latest
    needs: [scope]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: needs.scope.outputs.lane != 'objective'
        with:
          terraform_version: 1.15.8
      - name: Format
        if: needs.scope.outputs.lane == 'full'
        run: terraform fmt -check -recursive
      - name: Initialize without a backend
        if: needs.scope.outputs.lane == 'full'
        run: terraform init -backend=false -input=false
      - name: Validate
        if: needs.scope.outputs.lane == 'full'
        run: terraform validate
      - name: Validate stage-zero module
        if: needs.scope.outputs.lane == 'full'
        run: |
          terraform -chdir=bootstrap-admin init -backend=false -input=false
          terraform -chdir=bootstrap-admin validate
      - name: Validate AWS Terraform stacks
        if: needs.scope.outputs.lane == 'full'
        run: |
          terraform -chdir=aws/bootstrap-admin init -backend=false -input=false
          terraform -chdir=aws/bootstrap-admin validate
          terraform -chdir=aws/bootstrap-admin test
          terraform -chdir=aws init -backend=false -input=false
          terraform -chdir=aws validate
          terraform -chdir=aws/modules/fargate init -backend=false -input=false
          terraform -chdir=aws/modules/fargate test
          terraform -chdir=aws-control init -backend=false -input=false
          terraform -chdir=aws-control validate
          terraform -chdir=aws-control test
          terraform -chdir=qualification/aws-native init -backend=false -input=false
          terraform -chdir=qualification/aws-native validate
          terraform -chdir=qualification/aws-native test
      - name: Validate Azure Terraform stacks
        if: needs.scope.outputs.lane == 'full'
        run: |
          terraform -chdir=azure/bootstrap-admin init -backend=false -input=false
          terraform -chdir=azure/bootstrap-admin validate
          terraform -chdir=azure/bootstrap-admin test
          terraform -chdir=azure init -backend=false -input=false
          terraform -chdir=azure validate
          terraform -chdir=azure test
          terraform -chdir=azure/modules/container-apps-jobs init -backend=false -input=false
          terraform -chdir=azure/modules/container-apps-jobs test
      - name: Validate OCI Terraform stacks
        if: needs.scope.outputs.lane == 'full'
        run: |
          terraform -chdir=oci/bootstrap-admin init -backend=false -input=false
          terraform -chdir=oci/bootstrap-admin validate
          terraform -chdir=oci/bootstrap-admin test
          terraform -chdir=oci init -backend=false -input=false
          terraform -chdir=oci validate
          terraform -chdir=oci test
      - name: Validate GCP Control Terraform stack
        if: needs.scope.outputs.lane == 'full'
        run: |
          terraform -chdir=gcp-control init -backend=false -input=false
          terraform -chdir=gcp-control validate
          terraform -chdir=gcp-control test
      - name: Validate Kubernetes Helm chart
        if: needs.scope.outputs.lane == 'full'
        run: |
          helm lint kubernetes/chart/dander --values ../tests/fixtures/kubernetes-values.yaml
          helm template dander kubernetes/chart/dander \
            --namespace dander-test \
            --values ../tests/fixtures/kubernetes-values.yaml >/tmp/dander-kubernetes.yaml
          helm lint kubernetes/chart/dander-control \
            --values ../tests/fixtures/kubernetes-control-values.yaml
          helm template dander-control kubernetes/chart/dander-control \
            --namespace dander-control \
            --values ../tests/fixtures/kubernetes-control-values.yaml \
            >/tmp/dander-control-kubernetes.yaml
      - name: Validate cross-cloud feasibility roots
        if: needs.scope.outputs.lane == 'full'
        run: |
          terraform fmt -check -recursive ../acceptance/cloud-portability/phase1b
          terraform -chdir=../acceptance/cloud-portability/phase1b/ecr init -backend=false -input=false
          terraform -chdir=../acceptance/cloud-portability/phase1b/ecr validate
          terraform -chdir=../acceptance/cloud-portability/phase1b/smoke init -backend=false -input=false
          terraform -chdir=../acceptance/cloud-portability/phase1b/smoke validate
          terraform fmt -check -recursive ../acceptance/cloud-portability/phase6/azure-google-federation
          terraform -chdir=../acceptance/cloud-portability/phase6/azure-google-federation init -backend=false -input=false
          terraform -chdir=../acceptance/cloud-portability/phase6/azure-google-federation validate
          terraform -chdir=../acceptance/cloud-portability/phase6/azure-google-federation test
      - name: Static security analysis
        if: needs.scope.outputs.lane == 'full'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
      - name: Validate AWS-native qualification Terraform
        if: needs.scope.outputs.lane == 'benchmark'
        run: |
          terraform fmt -check -recursive qualification/aws-native
          terraform -chdir=qualification/aws-native init -backend=false -input=false
          terraform -chdir=qualification/aws-native validate
          terraform -chdir=qualification/aws-native test
      - name: Confirm objective lane has no Terraform blast radius
        if: needs.scope.outputs.lane == 'objective'
        working-directory: .
        run: test "${{ needs.scope.outputs.lane }}" = "objective"

  distribution:
    name: Distribution install
    runs-on: ubuntu-latest
    needs: [scope, python-quality, terraform-quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: needs.scope.outputs.lane == 'full'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: needs.scope.outputs.lane == 'full'
        with:
          terraform_version: 1.15.8
      - name: Build and inspect artifacts
        if: needs.scope.outputs.lane == 'full'
        run: |
          python3 scripts/check_release_metadata.py
          uv build
          python scripts/check_distribution.py dist/*.whl dist/*.tar.gz
      - name: Install and run outside the checkout
        if: needs.scope.outputs.lane == 'full'
        run: |
          TEMP_DIR="$(mktemp -d)"
          VERSION="$(uv version --short)"
          INDEX=0
          for ARTIFACT in dist/*.whl dist/*.tar.gz; do
            ENV_DIR="$TEMP_DIR/venv-$INDEX"
            PROJECT_DIR="$TEMP_DIR/project-$INDEX"
            uv venv "$ENV_DIR"
            uv pip install --python "$ENV_DIR/bin/python" "$ARTIFACT"
            (
              cd "$TEMP_DIR"
              "$ENV_DIR/bin/dander" --version | grep -F "dander $VERSION"
              "$ENV_DIR/bin/dander" new "$PROJECT_DIR"
              cd "$PROJECT_DIR"
              "$ENV_DIR/bin/dander" validate
              grep -F "ARG DANDER_VERSION=$VERSION" Dockerfile
              "$ENV_DIR/bin/python" -c 'import dander; assert "site-packages" in dander.__file__'
            )
            INDEX=$((INDEX + 1))
          done
          FULL_ENV="$TEMP_DIR/venv-runtime-all"
          uv venv "$FULL_ENV"
          uv pip install --python "$FULL_ENV/bin/python" "dist/dander_platform-${VERSION}-py3-none-any.whl[runtime-all]"
          "$FULL_ENV/bin/python" -c \
            'from dander.providers.dependencies import require_full_runtime; require_full_runtime()'
          terraform -chdir="$TEMP_DIR/project-0/infra" init -backend=false -input=false
          terraform -chdir="$TEMP_DIR/project-0/infra" validate
      - name: Confirm distribution is outside this lane
        if: needs.scope.outputs.lane != 'full'
        run: test "${{ needs.scope.outputs.lane }}" != "full"

  container:
    name: Container build and scan
    runs-on: ubuntu-latest
    needs: [scope, python-quality, terraform-quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: needs.scope.outputs.lane == 'full'
      - name: Build immutable-check image
        if: needs.scope.outputs.lane == 'full'
        run: docker build --tag dander-ci:${{ github.sha }} .
      - name: Verify CLI starts
        if: needs.scope.outputs.lane == 'full'
        run: docker run --rm dander-ci:${{ github.sha }} --help
      - name: Verify qualification entrypoint
        if: needs.scope.outputs.lane == 'full'
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --mount type=bind,source="$PWD/tests/fixtures/qualification_runner_probe.py",target=/qualification-runner-probe.py,readonly \
            dander-ci:${{ github.sha }} qualification-run /qualification-runner-probe.py \
            --rows 2600000 --report /tmp/result.json \
            | grep -F '"arguments":["--rows","2600000","--report","/tmp/result.json"]'
      - name: Verify runtime contract and bundled proof assets
        if: needs.scope.outputs.lane == 'full'
        run: |
          test "$(docker run --rm --entrypoint /usr/bin/id dander-ci:${{ github.sha }} -u)" = "65532"
          docker run --rm --read-only --tmpfs /tmp dander-ci:${{ github.sha }} runtime conformance \
            | grep -F '"status":"succeeded"'
          docker run --rm --entrypoint /usr/bin/test dander-ci:${{ github.sha }} -f /app/connectors/hubspot_test.yaml
          docker run --rm --entrypoint /usr/bin/test dander-ci:${{ github.sha }} -f /app/models/staging/stg_hubspot__companies.yml
      - name: Scan image
        if: needs.scope.outputs.lane == 'full'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: dander-ci:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Build OCI lifecycle controller
        if: needs.scope.outputs.lane == 'full'
        run: |
          uv build --wheel
          VERSION="$(uv version --short)"
          docker build --platform linux/amd64 \
            --file infra/oci/controller/Dockerfile \
            --build-arg DANDER_WHEEL="dist/dander_platform-${VERSION}-py3-none-any.whl" \
            --tag dander-oci-controller:${{ github.sha }} .
      - name: Verify OCI lifecycle controller contract
        if: needs.scope.outputs.lane == 'full'
        run: |
          test "$(docker image inspect dander-oci-controller:${{ github.sha }} --format '{{.Architecture}}')" = "amd64"
          test "$(docker run --rm --platform linux/amd64 --entrypoint /usr/bin/id dander-oci-controller:${{ github.sha }} -u)" = "1000"
          docker run --rm --platform linux/amd64 --read-only --tmpfs /tmp \
            --entrypoint /usr/bin/python3.12 dander-oci-controller:${{ github.sha }} \
            -c 'import dander, func, oci; assert callable(func.handler)'
      - name: Scan OCI lifecycle controller
        if: needs.scope.outputs.lane == 'full'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: dander-oci-controller:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Build fixed Managed Spark image
        if: needs.scope.outputs.lane == 'full'
        run: |
          docker build --platform linux/amd64 \
            --file infra/spark/Dockerfile \
            --build-arg DANDER_BUILD_REVISION="${{ github.sha }}" \
            --tag dander-spark:${{ github.sha }} .
      - name: Verify Managed Spark image and driver pair
        if: needs.scope.outputs.lane == 'full'
        run: |
          test "$(docker image inspect dander-spark:${{ github.sha }} --format '{{.Architecture}}')" = "amd64"
          test "$(docker run --rm --platform linux/amd64 --entrypoint /usr/bin/id dander-spark:${{ github.sha }} -u)" = "1099"
          test "$(sha256sum scripts/spark_driver.py | cut -d ' ' -f1)" = "$(docker run --rm --platform linux/amd64 --entrypoint /usr/bin/sha256sum dander-spark:${{ github.sha }} /opt/dander/spark_driver.py | cut -d ' ' -f1)"
          docker run --rm --platform linux/amd64 --entrypoint /usr/bin/test \
            dander-spark:${{ github.sha }} -x /usr/bin/tini
      - name: Scan Managed Spark image
        if: needs.scope.outputs.lane == 'full'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: dander-spark:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Confirm container builds are outside this lane
        if: needs.scope.outputs.lane != 'full'
        run: test "${{ needs.scope.outputs.lane }}" != "full"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
