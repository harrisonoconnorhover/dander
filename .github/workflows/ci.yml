name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --frozen --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Strict typing
        run: uv run mypy src tests
      - name: Tests
        run: uv run pytest
      - name: Dependency audit
        run: |
          uv export --frozen --format requirements.txt --no-dev --no-emit-project \
            --output-file /tmp/dander-requirements.txt
          uv run --with pip-audit pip-audit --strict -r /tmp/dander-requirements.txt

  terraform-quality:
    name: Terraform quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - name: Format
        run: terraform fmt -check -recursive
      - name: Initialize without a backend
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      - name: Validate stage-zero module
        run: |
          terraform -chdir=bootstrap-admin init -backend=false -input=false
          terraform -chdir=bootstrap-admin validate
      - name: Static security analysis
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  distribution:
    name: Distribution install
    runs-on: ubuntu-latest
    needs: [python-quality, terraform-quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - name: Build and inspect artifacts
        run: |
          uv build
          python scripts/check_distribution.py dist/*.whl dist/*.tar.gz
      - name: Install and run outside the checkout
        run: |
          TEMP_DIR="$(mktemp -d)"
          INDEX=0
          for ARTIFACT in dist/*.whl dist/*.tar.gz; do
            ENV_DIR="$TEMP_DIR/venv-$INDEX"
            PROJECT_DIR="$TEMP_DIR/project-$INDEX"
            uv venv "$ENV_DIR"
            uv pip install --python "$ENV_DIR/bin/python" "$ARTIFACT"
            (
              cd "$TEMP_DIR"
              "$ENV_DIR/bin/dander" --version | grep -F "dander 0.5.0rc1"
              "$ENV_DIR/bin/dander" new "$PROJECT_DIR"
              cd "$PROJECT_DIR"
              "$ENV_DIR/bin/dander" validate
              grep -F "ARG DANDER_VERSION=0.5.0rc1" Dockerfile
              "$ENV_DIR/bin/python" -c 'import dander; assert "site-packages" in dander.__file__'
            )
            INDEX=$((INDEX + 1))
          done
          terraform -chdir="$TEMP_DIR/project-0/infra" init -backend=false -input=false
          terraform -chdir="$TEMP_DIR/project-0/infra" validate

  container:
    name: Container build and scan
    runs-on: ubuntu-latest
    needs: [python-quality, terraform-quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Build immutable-check image
        run: docker build --tag dander-ci:${{ github.sha }} .
      - name: Verify CLI starts
        run: docker run --rm dander-ci:${{ github.sha }} --help
      - name: Verify runtime contract and bundled proof assets
        run: |
          test "$(docker run --rm --entrypoint /usr/bin/id dander-ci:${{ github.sha }} -u)" = "65532"
          docker run --rm --entrypoint /usr/bin/test dander-ci:${{ github.sha }} -f /app/connectors/hubspot_test.yaml
          docker run --rm --entrypoint /usr/bin/test dander-ci:${{ github.sha }} -f /app/models/staging/stg_hubspot__companies.yml
      - name: Scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: dander-ci:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
