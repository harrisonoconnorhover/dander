name: Publish Python distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build approved tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Require an exact version tag
        run: |
          VERSION="$(uv version --short)"
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
      - name: Reject stale public release metadata
        run: python3 scripts/check_release_metadata.py
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate distribution contents
        run: python scripts/check_distribution.py dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distribution
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dander-platform
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
