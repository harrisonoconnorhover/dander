apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "serviceAccount.name is required" .Values.serviceAccount.name }}
  labels:
    {{- include "dander-control.labels" . | nindent 4 }}
    dander.io/workload: control
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-druff" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "dander-control.labels" . | nindent 4 }}
    dander.io/workload: druff
automountServiceAccountToken: false
