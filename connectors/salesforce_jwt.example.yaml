# Read-only Salesforce Accounts template. Replace YOUR_DOMAIN and the JWT subject with values from
# your Salesforce org. The issuer and RSA private key are secret references, never literal values.
name: salesforce
engine: salesforce_bulk2
base_url: https://YOUR_DOMAIN.my.salesforce.com/services/data/v67.0
auth_strategy: oauth2_jwt
auth_refs:
  issuer: SALESFORCE_EXTERNAL_CLIENT_APP_ID
  private_key: SALESFORCE_EXTERNAL_CLIENT_APP_PRIVATE_KEY
auth_options:
  token_url: https://login.salesforce.com/services/oauth2/token
  # Salesforce validates aud against the authorization server, not the token endpoint.
  audience: https://login.salesforce.com
  subject: integration-user@example.com
  assertion_lifetime: 120
  # Salesforce token responses can omit expires_in.
  default_expires_in: 300
rate_limit:
  requests_per_second: 5
  burst: 2
  backoff: exponential
  max_retries: 4

endpoints:
  - name: accounts
    path: /jobs/query
    pagination:
      kind: header_cursor
      next_cursor_header: Sforce-Locator
      cursor_param: locator
      size_param: maxRecords
      page_size: 10000
      terminal_value: "null"
    request_body:
      operation: queryAll
      query: >-
        SELECT Id, Name, Type, Industry, AnnualRevenue, NumberOfEmployees,
        BillingCity, BillingState, BillingCountry, CreatedDate, LastModifiedDate,
        SystemModstamp, IsDeleted FROM Account
      contentType: CSV
      columnDelimiter: COMMA
      lineEnding: LF
    primary_key: [Id]
    incremental_cursor: SystemModstamp
    raw_schema:
      - name: attributes
        type: RECORD
        fields:
          - name: type
            type: STRING
          - name: url
            type: STRING
      - name: Id
        type: STRING
        mode: REQUIRED
      - name: Name
        type: STRING
        mode: REQUIRED
      - name: Type
        type: STRING
      - name: Industry
        type: STRING
      - name: AnnualRevenue
        type: NUMERIC
      - name: NumberOfEmployees
        type: INT64
      - name: BillingCity
        type: STRING
      - name: BillingState
        type: STRING
      - name: BillingCountry
        type: STRING
      - name: CreatedDate
        type: TIMESTAMP
        mode: REQUIRED
      - name: LastModifiedDate
        type: TIMESTAMP
        mode: REQUIRED
      - name: SystemModstamp
        type: TIMESTAMP
        mode: REQUIRED
      - name: IsDeleted
        type: BOOL
        mode: REQUIRED
