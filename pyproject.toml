[project]
name = "dander-platform"
version = "0.9.0rc23"
description = "Opinionated, GCP-native, self-hosted data platform: ingest + transform + catalog behind one CLI."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Harrison O'Connor-Hover" }]
keywords = ["bigquery", "data-platform", "etl", "gcp", "terraform"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "dlt[bigquery]>=1.0",            # standard-REST ingestion path (hybrid decision)
  "google-cloud-bigquery>=3.25",
  "google-cloud-bigquery-storage>=2.30",
  "google-cloud-dataplex>=2.20,<3",
  "google-cloud-secret-manager>=2.20",
  "google-auth>=2.35",
  "pydantic>=2.12",                # config + per-call strict-extra graph validation
  "pydantic-settings>=2.3",
  "packaging>=24.0",              # exact plugin pins + installed-version comparison
  "typer>=0.12",                   # CLI
  "jinja2>=3.1",                   # transform templating (ref())
  "sqlglot>=25.0",                 # SQL parsing for the transform DAG
  "httpx>=0.27",                   # enterprise-source transport
  "requests>=2.32",                # rate-limited session injected into dlt REST clients
  "tenacity>=8.5",                 # backoff/retry for the hand-rolled path
  "pyyaml>=6.0",
  "fastapi>=0.115",                # hosted Control API transport
  "uvicorn>=0.30",                 # hosted Control API server
  "pyjwt[crypto]>=2.13,<3",        # hosted OIDC access-token verification
]

[project.urls]
Homepage = "https://github.com/harrisonoconnorhover/dander"
Documentation = "https://github.com/harrisonoconnorhover/dander/blob/main/docs/getting-started.md"
Issues = "https://github.com/harrisonoconnorhover/dander/issues"
Repository = "https://github.com/harrisonoconnorhover/dander.git"
Changelog = "https://github.com/harrisonoconnorhover/dander/blob/main/CHANGELOG.md"
Security = "https://github.com/harrisonoconnorhover/dander/security/policy"

[project.scripts]
dander = "dander.cli.entrypoint:main"
dander-synthetic-api = "dander.dev.synthetic_vendor:main"

[project.optional-dependencies]
bigquery = [
  "dlt[bigquery]>=1.0",
  "google-cloud-bigquery>=3.25",
  "google-cloud-bigquery-storage>=2.30",
]
snowflake = [
  "pyarrow>=19,<26",
  "snowflake-connector-python>=3.12,<5",
]
redshift = [
  "boto3>=1.35,<2",
  "pyarrow>=19,<26",
  "redshift-connector>=2.1,<3",
]
postgres = [
  "psycopg[pool]>=3.2,<4; sys_platform == 'linux'",
  "psycopg[binary,pool]>=3.2,<4; sys_platform != 'linux'",
]
gcp = [
  "google-auth>=2.35",
  "google-cloud-dataplex>=2.20,<3",
  "google-cloud-secret-manager>=2.20",
  "google-cloud-storage>=3.4,<4",
]
aws = [
  "boto3>=1.35.69,<2",
]
azure = [
  "azure-identity>=1.19,<2",
  "azure-keyvault-secrets>=4.9,<5",
  "azure-storage-blob>=12.28,<13",
]
oci = [
  "oci>=2.184.1,<3",
]
runtime-all = [
  "azure-identity>=1.19,<2",
  "azure-keyvault-secrets>=4.9,<5",
  "azure-storage-blob>=12.28,<13",
  "boto3>=1.35.69,<2",
  "dlt[bigquery]>=1.0",
  "google-auth>=2.35",
  "google-cloud-bigquery>=3.25",
  "google-cloud-bigquery-storage>=2.30",
  "google-cloud-dataplex>=2.20,<3",
  "google-cloud-secret-manager>=2.20",
  "google-cloud-storage>=3.4,<4",
  "oci>=2.184.1,<3",
  "psycopg[pool]>=3.2,<4; sys_platform == 'linux'",
  "psycopg[binary,pool]>=3.2,<4; sys_platform != 'linux'",
  "pyarrow>=19,<26",
  "redshift-connector>=2.1,<3",
  "snowflake-connector-python>=3.12,<5",
]
dev = [
  "jsonschema>=4.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "types-jsonschema>=4.23",
  "types-pyyaml",
  "types-protobuf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "**/.DS_Store",
  "**/.terraform/**",
  "**/__pycache__/**",
  "**/*.tfplan",
  "**/*.tfstate*",
  "**/*.tfvars",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dander"]

