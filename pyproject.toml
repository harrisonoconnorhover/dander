[tool.hatch.build.targets.sdist]
include = [
  ".dockerignore",
  "CHANGELOG.md",
  "contracts/netsuite-suiteql-simulator.openapi.yaml",
  "Dockerfile",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "connectors",
  "dander.yaml",
  "docs/getting-started.md",
  "docs/aws-glue.md",
  "docs/connector-plugins.md",
  "docs/compatibility-matrix.md",
  "docs/control-contracts.md",
  "docs/execution-projection.md",
  "docs/known-limitations.md",
  "docs/netsuite-simulator.md",
  "docs/operator-soak.md",
  "docs/postgresql-benchmarks.md",
  "docs/oci-artifact-contract.md",
  "docs/rollback.md",
  "docs/redshift.md",
  "docs/snowflake.md",
  "docs/upgrading.md",
  "docs/warehouse-staging.md",
  "docs/warehouse-correctness-conformance.md",
  "examples",
  "infra",
  "graphs",
  "models",
  "pyproject.toml",
  "scripts/__init__.py",
  "scripts/benchmarks/__init__.py",
  "scripts/benchmarks/postgresql.py",
  "scripts/benchmarks/warehouse_correctness.py",
  "scripts/check_control_contracts.py",
  "scripts/generate_control_contracts.py",
  "src",
  "tests",
  "uv.lock",
]
exclude = [
  "**/.DS_Store",
  "**/.terraform/**",
  "**/__pycache__/**",
  "**/*.tfplan",
  "**/*.tfstate*",
  "**/*.tfvars",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/dander/templates/plugin"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
exclude = ["^src/dander/templates/plugin/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
