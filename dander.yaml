version: 1

platform:
  region: us-central1
  bigquery_location: US
  runtime:
    cpu: 1
    memory: 512Mi
    timeout_seconds: 300
    max_retries: 1
    batch_rows: 10000
  safety:
    require_guarded_free_tier: true

pipelines:
  phase8_aws_qualification:
    source: phase8_aws_fixture
    models: [stg_phase8_aws__posts]
    publish_dataplex: true
    schedule: "0 8 * * *"
    time_zone: America/New_York
    paused: true
    resources:
      job: dander-phase8-aws-qualification
      runtime_service_account: dander-runtime-phase8-aws
      scheduler_service_account: dander-scheduler-phase8-aws

  greenhouse_jobs:
    source: greenhouse_job_board
    models: [stg_greenhouse__jobs]
    schedule: "0 9 * * *"
    time_zone: America/New_York
    paused: true
    resources:
      job: dander-greenhouse-public
      runtime_service_account: dander-runtime
      scheduler_service_account: dander-scheduler

  hubspot_companies:
    source: hubspot_test
    models: [stg_hubspot__companies]
    schedule: "0 10 * * *"
    time_zone: America/New_York
    paused: true
    secrets:
      HUBSPOT_PRIVATE_APP_TOKEN: hubspot-private-app-token
    resources:
      job: dander-hubspot-companies
      runtime_service_account: dander-runtime-hubspot
      scheduler_service_account: dander-scheduler-hubspot

  salesforce_accounts:
    source: salesforce
    models:
      - stg_salesforce__users
      - stg_salesforce__accounts
      - stg_salesforce__contacts
      - stg_salesforce__opportunities
      - fct_salesforce__opportunities
    publish_dataplex: true
    schedule: "0 11 * * *"
    time_zone: America/New_York
    paused: true
    secrets:
      SALESFORCE_EXTERNAL_CLIENT_APP_ID: salesforce-external-client-app-id
      SALESFORCE_EXTERNAL_CLIENT_APP_PRIVATE_KEY: salesforce-external-client-app-private-key
    resources:
      job: dander-salesforce-accounts
      runtime_service_account: dander-runtime-salesforce
      scheduler_service_account: dander-scheduler-salesforce

  servicenow_incidents:
    source: servicenow
    models: [stg_servicenow__incidents]
    schedule: "0 12 * * *"
    time_zone: America/New_York
    paused: true
    secrets:
      SERVICENOW_CLIENT_ID: servicenow-client-id
      SERVICENOW_CLIENT_SECRET: servicenow-client-secret
    resources:
      job: dander-servicenow-incidents
      runtime_service_account: dander-runtime-servicenow
      scheduler_service_account: dander-scheduler-servicenow

  greenhouse_jobs_graph:
    source: greenhouse_job_board
    graph: graphs/greenhouse_jobs.yaml
    models: []
    build_models: false
    schedule: "0 13 * * *"
    time_zone: America/New_York
    paused: true
    resources:
      job: dander-greenhouse-graph
      runtime_service_account: dander-runtime-graph
      scheduler_service_account: dander-scheduler-graph

  multistage_linear_qualification:
    source: greenhouse_job_board
    graph: graphs/multistage_linear_qualification.yaml
    models: []
    build_models: false
    schedule: "0 14 * * *"
    time_zone: America/New_York
    paused: true
    resources:
      job: dander-multistage-linear
      runtime_service_account: dander-runtime-multistage
      scheduler_service_account: dander-scheduler-multistage

  keyed_join_qualification:
    source: keyed_join_fixture
    graph: graphs/keyed_join_qualification.yaml
    models: []
    build_models: false
    schedule: "0 14 * * *"
    time_zone: America/New_York
    paused: true
    resources:
      job: dander-keyed-join
      runtime_service_account: dander-runtime-keyed-join
      scheduler_service_account: dander-scheduler-keyed-join
